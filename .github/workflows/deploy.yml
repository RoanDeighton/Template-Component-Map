name: Deploy site inventory to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web

      # This is a GitHub Pages *project* site, served from
      # /<repo-name>/... rather than the domain root — NEXT_BASE_PATH bakes
      # that prefix into every internal link and asset URL at build time
      # (see web/next.config.ts). The app itself is a static export: every
      # route is already enumerable at build time from output/<site>/,
      # read straight off disk (see web/lib/content.ts) — no server needed.
      - name: Build the Next.js app
        working-directory: web
        run: npm run build
        env:
          NEXT_BASE_PATH: /${{ github.event.repository.name }}

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

name: Deploy site inventories to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      # GitHub Pages serves exactly one site per repo, but this repo can hold
      # many site inventories (output/<site>/). So: build every site that has
      # generated content into its own subfolder of one combined deploy
      # (…/<repo>/<site>/), plus a small landing page linking to each. This
      # requires zero workflow changes when a new site inventory is added —
      # it's discovered automatically from the output/ folder.
      - name: Build every site inventory
        run: |
          set -e
          mkdir -p combined-dist

          # Unlisted, not indexed: reachable by direct link, kept out of
          # search engines. robots.txt covers the whole deploy (landing page
          # + every per-site subfolder); the per-site VitePress builds also
          # carry a matching <meta name="robots"> tag (see site-template/.vitepress/config.ts).
          printf 'User-agent: *\nDisallow: /\n' > combined-dist/robots.txt

          echo "<!doctype html><meta charset=utf-8><title>Site Inventories</title><meta name=robots content='noindex, nofollow'>" > combined-dist/index.html
          echo "<body style='font-family:system-ui,sans-serif;max-width:640px;margin:4rem auto;padding:0 1rem'>" >> combined-dist/index.html
          echo "<h1>Site Inventories</h1><ul>" >> combined-dist/index.html

          for dir in output/*/; do
            site="$(basename "$dir")"
            if [ ! -f "${dir}content/overview.md" ]; then
              echo "skip $site (no content/overview.md)"
              continue
            fi
            echo "building $site"
            SITE="$site" BASE_PATH="/${{ github.event.repository.name }}/$site/" npm run site:build
            mkdir -p "combined-dist/$site"
            cp -r "output/$site/site-dist/." "combined-dist/$site/"
            echo "<li><a href=\"./$site/\">$site</a></li>" >> combined-dist/index.html
          done

          echo "</ul></body>" >> combined-dist/index.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: combined-dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
